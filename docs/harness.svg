<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#345b72"/></marker></defs>
<style>text{font:17px system-ui,sans-serif;fill:#213744}.title{font-size:27px;font-weight:700}.small{font-size:14px}.box{fill:#f0f5f7;stroke:#345b72;stroke-width:2;rx:9}.line{fill:none;stroke:#345b72;stroke-width:2;marker-end:url(#a)}.power{stroke:#b66525;stroke-width:3;fill:none}.label{font-weight:600}</style>
<rect width="1200" height="870" fill="#fff"/><text x="35" y="42" class="title">AXIOM ROVER / REV B WIRING</text><text x="35" y="69" class="small">Design review only · Connector pin numbers refer to the PCB · Physical polarity, crimp and continuity tests required</text>
<rect class="box" x="35" y="100" width="260" height="125"/><text x="50" y="130" class="label">Pi 5 / host domain</text><text x="50" y="158">Separate USB-C power</text><text x="50" y="185">J1: 1/17 3V3 · 8 TX · 10 RX</text><text x="50" y="210" class="small">Ground pins per contract; 2/4 NC</text>
<rect class="box" x="400" y="115" width="160" height="100"/><text x="415" y="146" class="label">U1 ISO7721</text><text x="415" y="174">Isolated UART</text><text x="415" y="198" class="small">No ground bridge</text><path class="line" d="M295 160H400"/>
<rect class="box" x="670" y="100" width="485" height="125"/><text x="685" y="130" class="label">Shrike R0.4 / base domain</text><text x="685" y="158">USB-C sole 5 V entry · J2/J4 pin 1 VUSB NC</text><text x="685" y="185">J4-17 RX / J4-18 TX · sockets: 2 × 19 positions</text><text x="685" y="210" class="small">J12 replaces J1 only with Pi electrically removed</text><path class="line" d="M560 160H670"/>
<rect class="box" x="35" y="280" width="520" height="180"/><text x="50" y="311" class="label">Independent physical stop / external harness</text><text x="50" y="343">J5-1 3V3 → S1A normally closed → J5-2 ESTOP_N</text><text x="50" y="375">Fused 6 V → S1B normally closed → K1 coil</text><text x="50" y="405">K1 coil return → BASE_GND · rated flyback clamp</text><text x="50" y="437" class="small">K1 motor contact is normally OPEN; opening S1B drops motor power</text>
<rect class="box" x="670" y="280" width="485" height="180"/><text x="685" y="311" class="label">Carrier motor drive</text><text x="685" y="343">J7-1: fused, relay-switched regulated 6 V</text><text x="685" y="375">J7-2: motor source negative / BASE_GND</text><text x="685" y="405">U3 DRV8833PWP · nominal 1 A/channel</text><text x="685" y="437" class="small">U4 gates PWM; U5 isolates each stop/fault observation channel</text><path class="power" d="M555 365H650"/><text x="566" y="353" class="small">K1 NO</text>
<text x="35" y="504" class="label">Motors: 2 × 6 V MOT3001-6V60RPM</text><text x="35" y="534">J8: 1 MOTOR_L_P / 2 MOTOR_L_N · J9: 1 MOTOR_R_P / 2 MOTOR_R_N</text><text x="35" y="561" class="small">Both leads are bridge outputs. Neither motor lead is permanently ground. Verify delivered motor wire order.</text>
<rect class="box" x="35" y="595" width="350" height="133"/><text x="50" y="625" class="label">J3 / HC-SR04</text><text x="50" y="655">1: 5V · 2: TRIG · 3: ECHO · 4: GND</text><text x="50" y="681" class="small">Echo divider + 3.3 V buffer on carrier</text><text x="50" y="709" class="small">J6 sensor power: 1 BASE_5V / 2 GND</text>
<rect class="box" x="415" y="595" width="350" height="133"/><text x="430" y="625" class="label">J10 left / J11 right encoder</text><text x="430" y="655">1: GND · 2: 3V3 · 3: A · 4: B</text><text x="430" y="681" class="small">Verify phase and output type</text><text x="430" y="709" class="small">Calibrate quadrature counts/revolution</text>
<rect class="box" x="795" y="595" width="360" height="133"/><text x="810" y="625" class="label">J13 / external I2C IMU</text><text x="810" y="655">1 GND · 2 3V3 · 3 SDA · 4 SCL · 5 INT</text><text x="810" y="681" class="small">3.3 V-compatible module only</text><text x="810" y="709" class="small">Check parallel pull-ups and axes</text>
<text x="35" y="773">J3/J5/J6/J10/J11/J12/J13: JST XH · J7/J8/J9: JST VH · Do not connect by wire colour alone.</text><text x="35" y="807">Power off before mating. Keep motor current paths away from sensor wiring and the isolated host domain.</text><text x="35" y="840" class="small">See electrical-contract.md for all 40 Pi pins, both Shrike rows, buffer nets, source references and commissioning limits.</text>
</svg>
